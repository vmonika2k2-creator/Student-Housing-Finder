openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: student-housing
    description: Student rental discovery and housing assistance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /housing/listings:
    get:
      operationId: listStudentHousingListings
      tags: [student-housing]
      summary: List illustrative student rentals
      responses:
        "200":
          description: Example rental listings for exploring the student housing experience
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentHousingListing"
  /housing/assistant:
    post:
      operationId: sendStudentHousingChat
      tags: [student-housing]
      summary: Ask the housing assistant for student rental guidance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentHousingChatInput"
      responses:
        "200":
          description: Assistant reply grounded in the supplied sample listing IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentHousingChatResponse"
        "400":
          description: Invalid message or conversation
        "429":
          description: The message limit has been reached temporarily
        "502":
          description: The assistant could not complete the request
  /housing/search:
    post:
      operationId: searchStudentHousingRentals
      tags: [student-housing]
      summary: Search live Pune rentals through Square Yards MCP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentHousingRentalSearchInput"
      responses:
        "200":
          description: Rental listings and source-provided property details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentHousingRentalSearchResponse"
        "400":
          description: Search criteria are invalid
        "422":
          description: A requested Pune landmark could not be resolved
        "502":
          description: Square Yards MCP search failed
        "504":
          description: Square Yards MCP search timed out
  /housing/admin/session:
    get:
      operationId: getHousingAdminSession
      tags: [student-housing]
      summary: Check whether the current browser has an admin session
      responses:
        "200":
          description: Current admin authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingAdminSession"
    post:
      operationId: loginHousingAdmin
      tags: [student-housing]
      summary: Start an admin session with the configured password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousingAdminLogin"
      responses:
        "200":
          description: Admin session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingAdminSession"
        "400":
          description: Invalid login request
        "401":
          description: Password was not accepted
        "429":
          description: Too many login attempts
        "503":
          description: Admin password is not configured
  /housing/admin/logout:
    post:
      operationId: logoutHousingAdmin
      tags: [student-housing]
      summary: End the current admin session
      responses:
        "200":
          description: Admin session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingAdminSession"
  /housing/admin/agent-settings:
    get:
      operationId: getHousingAdminAgentSettings
      tags: [student-housing]
      summary: Read assistant behavior settings
      security:
        - housingAdminCookie: []
      responses:
        "200":
          description: Current assistant behavior settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentHousingAgentSettings"
        "401":
          description: Admin session required
    put:
      operationId: updateHousingAdminAgentSettings
      tags: [student-housing]
      summary: Update assistant behavior settings
      security:
        - housingAdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentHousingAgentSettingsInput"
      responses:
        "200":
          description: Updated assistant behavior settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentHousingAgentSettings"
        "400":
          description: Settings did not pass validation
        "401":
          description: Admin session required
components:
  securitySchemes:
    housingAdminCookie:
      type: apiKey
      in: cookie
      name: housing_admin_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudentHousingListing:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        city:
          type: string
        neighborhood:
          type: string
        monthlyRent:
          type: [number, 'null']
        currency:
          type: string
          enum: [INR]
        roomType:
          type: string
        furnished:
          type: [boolean, 'null']
        furnishingStatus:
          type: [string, 'null']
        propertyType:
          type: [string, 'null']
        bedrooms:
          type: [string, 'null']
        deposit:
          type: [string, 'null']
        area:
          type: [string, 'null']
        distanceKm:
          type: [number, 'null']
        listingUrl:
          type: [string, 'null']
        isVerified:
          type: [boolean, 'null']
        transitMinutes:
          type: [integer, 'null']
        amenities:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        tag:
          type: string
      required:
        - id
        - title
        - city
        - neighborhood
        - monthlyRent
        - currency
        - roomType
        - furnished
        - transitMinutes
        - amenities
        - imageUrl
        - tag
    StudentHousingRentalSearchInput:
      type: object
      properties:
        location:
          type: string
          minLength: 1
          maxLength: 120
        landmark:
          type: string
          maxLength: 120
          description: Optional Pune landmark to resolve with search_entities and search within its coordinates.
        minMonthlyRent:
          type: integer
          minimum: 0
        maxMonthlyRent:
          type: integer
          minimum: 0
        bedrooms:
          type: string
          description: BHK or unit label supported by search_properties.
        propertyType:
          type: string
          description: Exact property type name supported by search_properties.
        furnishing:
          type: string
          enum: [Furnished, Semi-Furnished, Unfurnished]
        amenities:
          type: array
          maxItems: 4
          items:
            type: string
            enum: [parking, lift, gym, security]
      required: [location]
    StudentHousingRentalSearchResponse:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/StudentHousingListing"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
        note:
          type: string
      required: [listings, total, page, totalPages]
    StudentHousingChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 1200
      required: [role, content]
    StudentHousingChatInput:
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        moveInUrgency:
          type: string
          enum: [flexible, soon, urgent]
        message:
          type: string
          minLength: 1
          maxLength: 1200
        history:
          type: array
          items:
            $ref: "#/components/schemas/StudentHousingChatMessage"
          maxItems: 30
        listingIds:
          type: array
          items:
            type: string
          maxItems: 20
      required: [message, history, listingIds]
    StudentHousingChatResponse:
      type: object
      properties:
        reply:
          type: string
        recommendedListingIds:
          type: array
          items:
            type: string
          maxItems: 3
      required: [reply, recommendedListingIds]
    HousingAdminSession:
      type: object
      properties:
        authenticated:
          type: boolean
      required: [authenticated]
    HousingAdminLogin:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
      required: [password]
    StudentHousingAgentSettings:
      type: object
      properties:
        persona:
          type: string
          maxLength: 1000
        tone:
          type: string
          maxLength: 300
        empathyScale:
          type: integer
          minimum: 0
          maximum: 10
        goalOrientationScale:
          type: integer
          minimum: 0
          maximum: 10
        empathyExamples:
          type: array
          description: >-
            Example replies for the five empathy stages, in order. Stage 1 covers
            scale values 0-1, stage 2 covers 2-3, stage 3 covers 4-6, stage 4
            covers 7-8, and stage 5 covers 9-10. A stage may be left blank.
          minItems: 5
          maxItems: 5
          items:
            type: string
            maxLength: 400
        goal:
          type: string
          description: The goal the assistant works toward in conversations. May be blank.
          maxLength: 500
        conversationBehavior: { type: string, maxLength: 5000 }
        guardrails: { type: string, maxLength: 5000 }
        handoverRules: { type: string, maxLength: 5000 }
        knowledgeRules: { type: string, maxLength: 5000 }
        ctaSettings: { type: string, maxLength: 2000 }
        feedbackSettings: { type: string, maxLength: 2000 }
        integrations:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              type: { type: string, enum: [api, mcp] }
              label: { type: string, maxLength: 100 }
              url: { type: string, format: uri, maxLength: 1000 }
            required: [id, type, label, url]
        updatedAt:
          type: string
          format: date-time
      required: [persona, tone, empathyScale, goalOrientationScale, empathyExamples, goal, conversationBehavior, guardrails, handoverRules, knowledgeRules, ctaSettings, feedbackSettings, integrations, updatedAt]
    StudentHousingAgentSettingsInput:
      type: object
      properties:
        persona:
          type: string
          minLength: 1
          maxLength: 1000
        tone:
          type: string
          minLength: 1
          maxLength: 300
        empathyScale:
          type: integer
          minimum: 0
          maximum: 10
        goalOrientationScale:
          type: integer
          minimum: 0
          maximum: 10
        empathyExamples:
          type: array
          description: >-
            Example replies for the five empathy stages, in order. Stage 1 covers
            scale values 0-1, stage 2 covers 2-3, stage 3 covers 4-6, stage 4
            covers 7-8, and stage 5 covers 9-10. A stage may be left blank.
          minItems: 5
          maxItems: 5
          items:
            type: string
            maxLength: 400
        goal:
          type: string
          description: The goal the assistant works toward in conversations. May be blank.
          maxLength: 500
        conversationBehavior: { type: string, maxLength: 5000 }
        guardrails: { type: string, maxLength: 5000 }
        handoverRules: { type: string, maxLength: 5000 }
        knowledgeRules: { type: string, maxLength: 5000 }
        ctaSettings: { type: string, maxLength: 2000 }
        feedbackSettings: { type: string, maxLength: 2000 }
        integrations:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              type: { type: string, enum: [api, mcp] }
              label: { type: string, minLength: 1, maxLength: 100 }
              url: { type: string, format: uri, maxLength: 1000 }
            required: [id, type, label, url]
      required: [persona, tone, empathyScale, goalOrientationScale, empathyExamples, goal]

