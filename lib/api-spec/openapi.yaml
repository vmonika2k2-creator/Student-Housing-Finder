openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: student-housing
    description: Student rental discovery and housing assistance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /housing/listings:
    get:
      operationId: listStudentHousingListings
      tags: [student-housing]
      summary: List illustrative student rentals
      responses:
        "200":
          description: Example rental listings for exploring the student housing experience
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentHousingListing"
  /housing/assistant:
    post:
      operationId: sendStudentHousingChat
      tags: [student-housing]
      summary: Ask the housing assistant for student rental guidance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentHousingChatInput"
      responses:
        "200":
          description: Assistant reply grounded in the supplied sample listing IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentHousingChatResponse"
        "400":
          description: Invalid message or conversation
        "429":
          description: The message limit has been reached temporarily
        "502":
          description: The assistant could not complete the request
  /housing/admin/session:
    get:
      operationId: getHousingAdminSession
      tags: [student-housing]
      summary: Check whether the current browser has an admin session
      responses:
        "200":
          description: Current admin authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingAdminSession"
    post:
      operationId: loginHousingAdmin
      tags: [student-housing]
      summary: Start an admin session with the configured password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousingAdminLogin"
      responses:
        "200":
          description: Admin session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingAdminSession"
        "400":
          description: Invalid login request
        "401":
          description: Password was not accepted
        "429":
          description: Too many login attempts
        "503":
          description: Admin password is not configured
  /housing/admin/logout:
    post:
      operationId: logoutHousingAdmin
      tags: [student-housing]
      summary: End the current admin session
      responses:
        "200":
          description: Admin session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingAdminSession"
  /housing/admin/agent-settings:
    get:
      operationId: getHousingAdminAgentSettings
      tags: [student-housing]
      summary: Read assistant behavior settings
      security:
        - housingAdminCookie: []
      responses:
        "200":
          description: Current assistant behavior settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentHousingAgentSettings"
        "401":
          description: Admin session required
    put:
      operationId: updateHousingAdminAgentSettings
      tags: [student-housing]
      summary: Update assistant behavior settings
      security:
        - housingAdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentHousingAgentSettingsInput"
      responses:
        "200":
          description: Updated assistant behavior settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentHousingAgentSettings"
        "400":
          description: Settings did not pass validation
        "401":
          description: Admin session required
components:
  securitySchemes:
    housingAdminCookie:
      type: apiKey
      in: cookie
      name: housing_admin_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudentHousingListing:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        city:
          type: string
        neighborhood:
          type: string
        monthlyRent:
          type: number
        currency:
          type: string
          enum: [INR]
        roomType:
          type: string
          enum: [Shared room, Private room, Studio]
        furnished:
          type: boolean
        transitMinutes:
          type: integer
        amenities:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        tag:
          type: string
      required:
        - id
        - title
        - city
        - neighborhood
        - monthlyRent
        - currency
        - roomType
        - furnished
        - transitMinutes
        - amenities
        - imageUrl
        - tag
    StudentHousingChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 1200
      required: [role, content]
    StudentHousingChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1200
        history:
          type: array
          items:
            $ref: "#/components/schemas/StudentHousingChatMessage"
          maxItems: 12
        listingIds:
          type: array
          items:
            type: string
          maxItems: 20
      required: [message, history, listingIds]
    StudentHousingChatResponse:
      type: object
      properties:
        reply:
          type: string
        recommendedListingIds:
          type: array
          items:
            type: string
          maxItems: 3
      required: [reply, recommendedListingIds]
    HousingAdminSession:
      type: object
      properties:
        authenticated:
          type: boolean
      required: [authenticated]
    HousingAdminLogin:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
      required: [password]
    StudentHousingAgentSettings:
      type: object
      properties:
        persona:
          type: string
          maxLength: 1000
        tone:
          type: string
          maxLength: 300
        empathyScale:
          type: integer
          minimum: 0
          maximum: 10
        goalOrientationScale:
          type: integer
          minimum: 0
          maximum: 10
        empathyExamples:
          type: array
          description: >-
            Example replies for the five empathy stages, in order. Stage 1 covers
            scale values 0-1, stage 2 covers 2-3, stage 3 covers 4-6, stage 4
            covers 7-8, and stage 5 covers 9-10. A stage may be left blank.
          minItems: 5
          maxItems: 5
          items:
            type: string
            maxLength: 400
        goal:
          type: string
          description: The goal the assistant works toward in conversations. May be blank.
          maxLength: 500
        updatedAt:
          type: string
          format: date-time
      required: [persona, tone, empathyScale, goalOrientationScale, empathyExamples, goal, updatedAt]
    StudentHousingAgentSettingsInput:
      type: object
      properties:
        persona:
          type: string
          minLength: 1
          maxLength: 1000
        tone:
          type: string
          minLength: 1
          maxLength: 300
        empathyScale:
          type: integer
          minimum: 0
          maximum: 10
        goalOrientationScale:
          type: integer
          minimum: 0
          maximum: 10
        empathyExamples:
          type: array
          description: >-
            Example replies for the five empathy stages, in order. Stage 1 covers
            scale values 0-1, stage 2 covers 2-3, stage 3 covers 4-6, stage 4
            covers 7-8, and stage 5 covers 9-10. A stage may be left blank.
          minItems: 5
          maxItems: 5
          items:
            type: string
            maxLength: 400
        goal:
          type: string
          description: The goal the assistant works toward in conversations. May be blank.
          maxLength: 500
      required: [persona, tone, empathyScale, goalOrientationScale, empathyExamples, goal]

